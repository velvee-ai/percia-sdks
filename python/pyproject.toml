[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "percia"
version = "0.3.5"
description = "Python SDK for the Percia API: watches, events, cameras, integrations, REST hooks and webhook signature verification."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Velvee, Inc.", email = "support@velvee.ai" }]
keywords = ["percia", "video", "alerts", "webhooks", "sdk"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.25,<1", "attrs>=22.2", "python-dateutil>=2.8.2"]

[project.urls]
Homepage = "https://www.percia.ai"
Repository = "https://github.com/velvee-ai/percia-sdks"
Documentation = "https://playground.percia.ai/docs/"
Issues = "https://github.com/velvee-ai/percia-sdks/issues"

[project.optional-dependencies]
dev = [
  "openapi-python-client==0.26.2",
  "pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff==0.13.3", "mypy>=1.10", "types-python-dateutil",
]

[tool.hatch.build.targets.wheel]
packages = ["percia"]

[tool.hatch.build.targets.sdist]
include = ["percia", "tests", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 120
extend-exclude = ["percia/_generated", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP006", "UP007", "UP035", "UP045"]  # keep typing.Optional/List spelled out: Python 3.9 at runtime

[tool.mypy]
python_version = "3.10"
strict = true
exclude = ["percia/_generated", "\\.venv"]

[[tool.mypy.overrides]]
module = ["percia._generated.*"]
ignore_errors = true
follow_imports = "skip"
