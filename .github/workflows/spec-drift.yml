name: Spec drift
# Fails when the live OpenAPI document no longer matches spec/openapi.json, so a server change cannot silently outrun the SDKs.
on:
  schedule: [{ cron: "17 6 * * *" }]
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: check
        run: node spec/scripts/sync.mjs --check
        continue-on-error: true
      - name: Open or update a tracking issue
        if: steps.check.outcome == 'failure' && github.event_name == 'schedule'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh issue list --label spec-drift --state open --json number --jq '.[0].number' > n.txt
          if [ -z "$(cat n.txt)" ]; then
            gh label create spec-drift --color D93F0B 2>/dev/null || true
            gh issue create --label spec-drift --title "OpenAPI spec drift" --body "The live document differs from spec/openapi.json. Run: pnpm spec:sync && pnpm generate, review the diff, commit. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
      - name: Fail the job
        if: steps.check.outcome == 'failure'
        run: exit 1
