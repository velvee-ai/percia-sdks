name: Release (npm)
# Written, not run. Uses changesets: merging the "Version packages" PR publishes @percia/sdk and @percia/cli to npm
# with trusted publishing (OIDC) and provenance: no npm token is stored. Prerequisites: docs/owner-steps.md.
on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write
  pull-requests: write
  id-token: write   # npm trusted publishing + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.repository == 'percia-ai/percia-sdks'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.5.1   # trusted publishing needs npm 11.5.1 or newer
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          title: "Version packages"
          commit: "Version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          # no NODE_AUTH_TOKEN: the OIDC identity authenticates the publish
