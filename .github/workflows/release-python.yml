name: Release (PyPI)
# Written, not run. Push a tag python-vX.Y.Z whose version matches python/pyproject.toml. Trusted publishing (OIDC): no PyPI token is stored.
on:
  push:
    tags: ["python-v*"]
  workflow_dispatch:
    inputs:
      repository: { description: "pypi or testpypi", default: testpypi }

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: python } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build "openapi-python-client==0.26.2" -e ".[dev]"
      - run: pytest -q
      - name: tag matches package version
        if: startsWith(github.ref, 'refs/tags/python-v')
        run: test "python-v$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" = "${GITHUB_REF_NAME}"
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: python/dist/ }

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi') && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write   # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: ${{ (github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi') && 'https://test.pypi.org/legacy/' || '' }}
