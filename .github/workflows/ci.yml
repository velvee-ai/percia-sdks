name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    name: spec (integrity + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm spec:verify      # openapi.json matches spec.lock.json
      - run: pnpm spec:lint

  generated:
    name: generated files are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pnpm install --frozen-lockfile
      - run: pip install "openapi-python-client==0.26.2" ruff==0.13.3
      - run: pnpm generate:check   # regenerates TS, Python and Postman from spec/openapi.json; fails on any diff

  typescript:
    name: typescript sdk (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { node: [20, 22, 24] }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @percia/sdk typecheck
      - run: pnpm --filter @percia/sdk test
      - run: pnpm --filter @percia/sdk build
      - name: CJS and ESM entry points load
        run: |
          node -e "const s=require('./typescript/dist/index.cjs'); if(typeof s.createClient!=='function') process.exit(1)"
          node --input-type=module -e "import('./typescript/dist/index.js').then(m=>{ if(typeof m.verifyWebhookSignature!=='function') process.exit(1) })"

  cli:
    name: cli (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { node: [20, 22, 24] }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @percia/sdk build
      - run: pnpm --filter @percia/cli typecheck
      - run: pnpm --filter @percia/cli test
      - run: pnpm --filter @percia/cli build
      - run: node cli/dist/bin.js --version && node cli/dist/bin.js --help >/dev/null

  python:
    name: python sdk (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { python: ["3.9", "3.10", "3.11", "3.12", "3.13"] }
    defaults: { run: { working-directory: python } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip, cache-dependency-path: python/pyproject.toml }
      - run: pip install -e ".[dev]"
      - run: ruff check percia tests
        if: matrix.python == '3.12'
      - run: mypy percia
        if: matrix.python == '3.12'
      - run: pytest -q

  postman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node postman/scripts/generate.mjs && git diff --exit-code postman
      - run: cd postman && npm test

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-go@v5
        with: { go-version: "stable" }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3" }
      - run: cd examples/node-express && npm ci && npm test
      - run: cd examples/cloudflare-worker && npm install && npm test
      - run: cd examples/python-fastapi && pip install -r requirements.txt pytest && pytest -q
      - run: cd examples/go && go test ./...
      - run: cd examples/ruby && ruby -Itest test/*_test.rb
      - run: cd examples/scripts/package-alert-to-slack && node --test
      - name: push-lan-camera example (Node and Python, offline, fake ffmpeg)
        run: |
          corepack enable && pnpm install --frozen-lockfile && pnpm --filter @percia/sdk build
          (cd examples/scripts/push-lan-camera && node --test)
          pip install -e python pytest && (cd examples/scripts/push-lan-camera && pytest -q test)
